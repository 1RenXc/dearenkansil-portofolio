<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Placeholder portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d26"/>
      <stop offset="1" stop-color="#0d131a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#1e2833" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="400" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <rect width="400" height="400" fill="url(#grid)"/>

    <!-- silhouette -->
    <circle cx="200" cy="158" r="54" fill="#2b3947"/>
    <path d="M200 228c-58 0-104 38-112 90v82h224v-82c-8-52-54-90-112-90Z" fill="#2b3947"/>

    <!-- accent rule -->
    <rect x="136" y="352" width="128" height="4" rx="2" fill="#3b82f6"/>
  </g>

  <text x="200" y="382" text-anchor="middle" fill="#7c8a99"
        font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15"
        letter-spacing="2">replace me</text>
</svg>
