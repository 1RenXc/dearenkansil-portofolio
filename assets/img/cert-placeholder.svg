<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 453" width="640" height="453" role="img" aria-label="Certificate image placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d26"/>
      <stop offset="1" stop-color="#0d131a"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#1e2833" stroke-width="1"/>
    </pattern>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity=".22"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="453" fill="url(#bg)"/>
  <rect width="640" height="453" fill="url(#grid)"/>
  <rect width="640" height="453" fill="url(#glow)"/>

  <!-- frame -->
  <rect x="20.5" y="20.5" width="599" height="412" rx="10" fill="none" stroke="#2b3947" stroke-width="1.5"/>
  <rect x="36.5" y="36.5" width="567" height="380" rx="6" fill="none" stroke="#1e2833" stroke-width="1.5" stroke-dasharray="8 8"/>

  <!-- document -->
  <rect x="248" y="108" width="144" height="176" rx="8" fill="#0b1118" stroke="#2b3947" stroke-width="1.5"/>
  <g stroke="#22303d" stroke-width="6" stroke-linecap="round">
    <path d="M272 142h96"/>
    <path d="M272 166h96"/>
    <path d="M272 190h62"/>
  </g>

  <!-- seal + ribbon -->
  <path d="M344 254 336 296l24-14 24 14-8-42" fill="none" stroke="url(#seal)" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="360" cy="234" r="23" fill="none" stroke="url(#seal)" stroke-width="2.5"/>
  <circle cx="360" cy="234" r="15" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity=".55"/>
  <path d="M353 234.5 358 239.5 368 228.5" fill="none" stroke="url(#seal)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- caption bars -->
  <rect x="252" y="320" width="136" height="10" rx="5" fill="#22303d"/>
  <rect x="282" y="344" width="76" height="8" rx="4" fill="#1a232d"/>

  <text x="320" y="398" text-anchor="middle" fill="#7c8a99"
        font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15"
        letter-spacing="2">replace me</text>
</svg>
